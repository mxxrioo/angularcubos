<div class="max-w-md">
  <h1 class="mb-5 text-2xl font-bold">Login</h1>
  <form #formlogin="ngForm" (ngSubmit)="formlogin.valid && logInUsuario()" class="space-y-4">
    <div><label for="email" class="label">Email:</label>
      
      <input id="email" name="email" #cajaemail ngModel type="email" email required autocomplete="email" class="input"></div>
    <div><label for="password" class="label">Contraseña:</label>
      <input id="password" name="password" #cajapassword ngModel type="password" required autocomplete="current-password" class="input"></div>
    
      @if (error) { <p class="text-red-700" role="alert">{{error}}</p> }
    <button class="btn-primary" [disabled]="formlogin.invalid || enviando">
      {{enviando ? 'Entrando...' : 'Iniciar sesión'}}</button>

  </form>
  <p class="mt-4"><a [routerLink]="['/registro']" class="text-blue-700 underline">Registrar nuevo usuario</a></p>
  <p class="mt-4 text-sm text-gray-600">Usuario de prueba: user1@mail.com / 12345</p>
</div>
